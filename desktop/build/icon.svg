  <path d="M290 392 Q512 356 734 392 L734 404 L290 404 Z" fill="#2c2c33"/>
  <rect x="284" y="392" width="456" height="22" rx="6" fill="url(#dark)" stroke="#0b0b0e" stroke-width="3"/>
  <rect x="290" y="410" width="444" height="5" rx="2" fill="#818cf8" opacity="0.8"/>

  <!-- 키보드 -->
  <rect x="338" y="558" width="300" height="104" rx="14" fill="#000" opacity="0.3" transform="translate(6 10)"/>
  <rect x="338" y="558" width="300" height="104" rx="14" fill="url(#dark)" stroke="#0b0b0e" stroke-width="3"/>
  <g fill="#55555e">
    <rect x="354" y="574" width="268" height="16" rx="4"/>
