  <rect x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="3"/>

  <!-- 책상 그림자 + 상판 -->
  <rect x="190" y="282" width="660" height="500" rx="28" fill="#000" opacity="0.45"/>
  <rect x="182" y="262" width="660" height="500" rx="28" fill="url(#wood)"/>
  <g clip-path="url(#deskClip)" stroke="#6b4423" stroke-opacity="0.18" fill="none" stroke-width="3">
    <path d="M182 318 C420 306 620 330 842 314"/>
    <path d="M182 402 C400 414 640 392 842 408"/>
    <path d="M182 488 C430 478 610 500 842 486"/>
    <path d="M182 580 C420 592 650 568 842 584"/>
    <path d="M182 672 C400 662 640 684 842 670"/>
  </g>

  <!-- 모니터 불빛 -->
  <path d="M300 392 L724 392 L800 560 L224 560 Z" fill="url(#glow)" clip-path="url(#deskClip)"/>

  <!-- 모니터 (위에서 본 모습): 받침 + 넥 + 본체 -->
  <rect x="440" y="300" width="144" height="150" rx="12" fill="#1f1f25" stroke="#0b0b0e" stroke-width="3"/>
