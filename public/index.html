<!DOCTYPE html>
<html lang="ko">

    <title>%WEB_TITLE%</title>

    <meta property="og:locale" content="ko_KR" />
    <meta property="og:url" content="https://deskboard-one.vercel.app/" />

    <meta property="og:image" content="https://deskboard-one.vercel.app/og.jpg" />

      body {
        height: 100%;
        background-color: #141417;
      }

      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

    <noscript>
      DeskBoard(데스크보드)는 책상과 장비를 실제 크기로 배치해 데스크 셋업을 미리 꾸며 보는 시뮬레이터입니다. 사용하려면 자바스크립트를 켜 주세요.
